<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FindMyWeather - Get weather details for any location">
    <meta name="keywords" content="weather, forecast, location, temperature">
    <meta name="author" content="Your Name">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <title>FindMyWeather</title>
</head>

<body>
    <main class="cont">
        <div class="wrapper">
            <h1>FindMyWeather</h1>
            <form id="form">
                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" name="location" id="location" required>
                </div>
                <div class="form-group">
                    <label for="start">Start Date</label>
                    <input type="date" name="start" id="start" required>
                </div>
                <div class="form-group">
                    <label for="end">End Date</label>
                    <input type="date" name="end" id="end" required>
                </div>
                <div class="form-group">
                    <button type="submit" id="submit">View Details</button>
                </div>
            </form>
            <div id="output-lines" style="display:none;">
                <table id="weather-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Max Temperature</th>
                            <th>Min Temperature</th>
                            <th>Conditions</th>
                            <th>Feels Like</th>
                        </tr>
                    </thead>
                    <tbody id="dates-info"></tbody>
                </table>
            </div>
        </div>
    </main>
    <script src="/script.js"></script>
</body>

</html>
